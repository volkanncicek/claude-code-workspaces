name: Release

on:
  push:
    tags: ["v*"]

# Nothing by default; each job states only what it needs, and a job-level block replaces this one rather than adding to it.
permissions: {}

env:
  UV_LOCKED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # A release builds from nothing a previous run could have left in a cache.
          enable-cache: false

      - name: Check the tag against the version being published
        # A tag that disagrees with pyproject publishes a version nobody asked for, and PyPI will not let it be replaced afterwards.
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(uv version --short)"
          if [ "$tagged" != "$declared" ]; then echo "Tag $GITHUB_REF_NAME does not match the declared version $declared"; exit 1; fi

      - name: Verify
        # CI runs on main, not on tags, so without this a tag could publish a commit nothing ever checked.
        run: |
          uv run prek run --all-files --show-diff-on-failure
          uv run ty check
          uv run pyright
          uv run pytest

      - name: Build
        # `--no-sources` builds the way an installer from PyPI would, ignoring any local `[tool.uv.sources]` override.
        run: uv build --no-sources

      - name: Smoke-test the built wheel
        # In an environment holding only the wheel and its declared dependencies, so a module missing from the package or an undeclared import fails here rather than for the first user.
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "import claude_code_workspaces"
          uv run --isolated --no-project --with dist/*.whl ccw --help

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    # Trusted publishing binds the OIDC token to this repository, this workflow filename and this environment, so none of the three can move without updating the publisher on PyPI. It also cannot be delegated: a reusable workflow or composite action does not get the token, so the publish step stays inline here.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      # The only credential involved. No PyPI token is stored in secrets.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Sigstore attestations are on by default here; leave them on.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    # After PyPI, never before it, so a release page cannot announce a version that is not installable yet.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The only write this workflow performs, and it is confined to this job.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The notes are this version's CHANGELOG section: everything after its heading, stopping at the next version heading or at the link definitions that close the file. The second awk drops the blank lines the heading leaves behind.
          awk -v v="## [$version]" 'index($0,v)==1{f=1;next} f&&(/^## \[/||/^\[[^]]+\]: /){exit} f' CHANGELOG.md | awk 'NF{p=1} p' > notes.md
          # An empty section means the tag and the CHANGELOG disagree, which is worth failing on rather than publishing a release with no notes.
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $version"; exit 1; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
